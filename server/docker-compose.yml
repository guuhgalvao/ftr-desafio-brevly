name: brevly

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: brevly
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docker -d brevly']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: runs the production image. Start with `docker compose --profile app up -d --build`.
  api:
    profiles: [app]
    build: .
    image: brevly-server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://docker:docker@postgres:5432/brevly
    ports:
      - '${PORT:-3333}:${PORT:-3333}'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
